name: Android source checks and unsigned artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caption-android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure isolated SDK path
        shell: bash
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
      - name: Reuse only the owner-approved standard SDK agreement
        shell: bash
        run: |
          # https://developer.android.com/studio/terms was approved for these builds.
          # This is the recorded standard license hash, not an optional-license sweep.
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install required SDK packages without accepting new licenses
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' < /dev/null
      - name: Verify orientation resources and canonical source bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-orientation-resources.py
          printf '%s\n' \
            '3ae35fd6e40bb419ef4d5a6cddc8baea7ac498e3d91f61b3b19ccfe502c9452b  app/src/main/java/com/hatsunama/refract/RefractBackgroundView.kt' \
            '4790b0f5976406755f9f2b72c5a390aad5746441f95591074382f28710e8f66d  app/src/main/java/com/hatsunama/refract/RefractSeed.kt' | sha256sum --check
      - name: Unit tests, full lint, debug compilation and unsigned release packaging
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:preparePlayAab :app:prepareSolanaApk --no-daemon --max-workers=1 --stacktrace
      - name: Audit archive sizes and native alignment
        run: |
          python3 scripts/audit-package.py app/build/distribution/play/*.aab app/build/distribution/solana/*.apk > app/build/distribution/package-audit.json
          sha256sum app/build/distribution/play/*.aab app/build/distribution/solana/*.apk > app/build/distribution/SHA256SUMS
      - name: Preserve check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caption-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve unsigned artifacts (never publish or sign)
        uses: actions/upload-artifact@v4
        with:
          name: caption-unsigned-review-artifacts
          path: app/build/distribution/
          if-no-files-found: error
          retention-days: 7
